name: Build and Push Docker Images (MCP + WebApp)

on:
  push:
    branches:
      - main
      - master
      - 'feature/**'
    paths:
      - 'bmac-mcp-server/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/docker-build.yml'
      - 'Dockerfile.mcp'
      - 'Dockerfile.webapp'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - 'components.json'
      - 'tsconfig.json'
      - 'drizzle.config.ts'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'bmac-mcp-server/**'
      - 'src/**'
      - 'public/**'
      - '.github/workflows/docker-build.yml'
      - 'Dockerfile.mcp'
      - 'Dockerfile.webapp'
      - '.dockerignore'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.ts'
      - 'postcss.config.mjs'
      - 'components.json'
      - 'tsconfig.json'
      - 'drizzle.config.ts'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-mcp:
    if: false 
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: bmac-mcp-server/package-lock.json

      - name: Install dependencies
        working-directory: bmac-mcp-server
        run: npm ci

      - name: Build TypeScript
        working-directory: bmac-mcp-server
        run: npm run build

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mcp
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64

      - name: Image digest
        run: echo ${{ steps.meta.outputs.digest }}

  build-and-push-webapp:
    name: Build and Push Next.js WebApp Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for WebApp image
        id: meta-webapp
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-webapp
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push WebApp Docker image
        id: build-webapp
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.webapp
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta-webapp.outputs.tags }}
          labels: ${{ steps.meta-webapp.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          load: true

      - name: Smoke test - Start and test the webapp
        run: |
          echo "Starting webapp container for smoke test..."
          docker run -d --name webapp-test -p 3000:3000 \
            -e NODE_ENV=production \
            ${{ steps.meta-webapp.outputs.tags }}
          
          echo "Waiting for webapp to start (max 60 seconds)..."
          for i in {1..30}; do
            if curl -f http://localhost:3000 > /dev/null 2>&1; then
              echo "Webapp is responding!"
              echo "Making test request..."
              curl -v http://localhost:3000
              echo ""
              echo "Smoke test PASSED"
              docker logs webapp-test
              docker stop webapp-test
              docker rm webapp-test
              exit 0
            fi
            echo "Attempt $i/30: Webapp not ready yet, waiting 2s..."
            sleep 2
          done
          
          echo "ERROR: Webapp failed to start within 60 seconds"
          echo "Container logs:"
          docker logs webapp-test
          docker stop webapp-test
          docker rm webapp-test
          exit 1

      - name: WebApp image digest
        run: echo ${{ steps.meta-webapp.outputs.digest }}

  manual-test-webapp:
    name: Manual Test WebApp with Ngrok
    needs: build-and-push-webapp
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && startsWith(github.ref, 'refs/heads/feature/')
    
    steps:
      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Pull the built image
        run: |
          # Replace / with - in branch name for Docker tag
          BRANCH_TAG="${{ github.ref_name }}"
          BRANCH_TAG="${BRANCH_TAG//\//-}"
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-webapp:${BRANCH_TAG}"
          echo "Pulling image: $IMAGE_TAG"
          docker pull $IMAGE_TAG
      
      - name: Start webapp container
        run: |
          # Replace / with - in branch name for Docker tag
          BRANCH_TAG="${{ github.ref_name }}"
          BRANCH_TAG="${BRANCH_TAG//\//-}"
          IMAGE_TAG="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-webapp:${BRANCH_TAG}"
          echo "Starting webapp container with CI test mode..."
          docker run -d --name webapp-test \
            -p 3000:3000 \
            -e NODE_ENV=production \
            -e NEXT_PUBLIC_CI_TEST_MODE=true \
            $IMAGE_TAG
          
          echo "Waiting for webapp to be ready..."
          for i in {1..30}; do
            if docker logs webapp-test 2>&1 | grep -q "Ready in\|started server on"; then
              echo "Webapp is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done
      
      - name: Install and setup Ngrok
        env:
          NGROK_TOKEN: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
        run: |
          if [ -z "$NGROK_TOKEN" ]; then
            echo "ERROR: NGROK_AUTHTOKEN secret is not set!"
            echo "Please set it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          
          if [ -z "$NGROK_DOMAIN" ]; then
            echo "ERROR: NGROK_DOMAIN secret is not set!"
            echo "Please set it at: https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi
          
          echo "Installing ngrok..."
          curl -s https://ngrok-agent.s3.amazonaws.com/ngrok.asc | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
          echo "deb https://ngrok-agent.s3.amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
          sudo apt update && sudo apt install ngrok
          
          echo "Configuring ngrok with authtoken..."
          ngrok config add-authtoken "$NGROK_TOKEN"
          echo "Ngrok configured successfully!"
      
      - name: Start Ngrok tunnel
        env:
          NGROK_DOMAIN: ${{ secrets.NGROK_DOMAIN }}
        run: |
          echo "Starting ngrok tunnel with domain: $NGROK_DOMAIN"
          ngrok http 3000 --domain="$NGROK_DOMAIN" --log=stdout > ngrok.log 2>&1 &
          NGROK_PID=$!
          echo "NGROK_PID=$NGROK_PID" >> $GITHUB_ENV
          
          echo "Waiting for ngrok to start..."
          sleep 5
          
          echo "Checking ngrok status..."
          if ps -p $NGROK_PID > /dev/null; then
            echo "Ngrok is running with PID: $NGROK_PID"
          else
            echo "ERROR: Ngrok failed to start!"
            cat ngrok.log
            exit 1
          fi
          
          echo ""
          echo "=========================================="
          echo "WEBAPP IS READY FOR MANUAL TESTING"
          echo "=========================================="
          echo ""
          echo "URL: https://$NGROK_DOMAIN"
          echo ""
          echo "When you're done testing, click the 'Continue CI Build' button"
          echo "in the yellow banner at the top of the page."
          echo ""
          echo "The workflow will wait for up to 30 minutes."
          echo "=========================================="
      
      - name: Wait for manual testing to complete
        run: |
          echo "Waiting for container to stop (max 30 minutes)..."
          timeout 1800 docker wait webapp-test || {
            echo "Timeout reached or container stopped"
          }
          
          echo "Container stopped - continuing CI build"
      
      - name: Cleanup
        if: always()
        run: |
          echo "Cleaning up..."
          docker stop webapp-test 2>/dev/null || true
          docker rm webapp-test 2>/dev/null || true
          kill $NGROK_PID 2>/dev/null || true
          echo "Cleanup complete"

  deploy-to-production:
    name: Deploy MCP to Production (obot-mcp namespace)
    needs: build-and-push-mcp
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
    
    steps:
      - name: Setup kubectl
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        uses: azure/setup-kubectl@v3

      - name: Configure kubeconfig
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config

      - name: Find and restart deployment
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/'))
        run: |
          echo "Finding deployment using our image..."
          
          # Find deployment that uses our image
          DEPLOYMENT=$(kubectl get deployments -n obot-mcp -o json | \
            jq -r '.items[] | select(.spec.template.spec.containers[].image | contains("catalog-api-mcp")) | .metadata.name' | \
            head -1)
          
          if [ -z "$DEPLOYMENT" ]; then
            echo "No deployment found using catalog-api-mcp image in obot-mcp namespace"
            echo "Available deployments:"
            kubectl get deployments -n obot-mcp
            exit 0
          fi
          
          echo "Found deployment: $DEPLOYMENT"
          echo "Restarting deployment to pick up new image..."
          kubectl rollout restart deployment $DEPLOYMENT -n obot-mcp
          
          echo "Waiting for rollout to complete..."
          kubectl rollout status deployment $DEPLOYMENT -n obot-mcp --timeout=300s
          
          echo "Deployment restarted successfully!"

  deploy-webapp-to-k3s-dev:
    name: Deploy WebApp to K3s Development
    needs: [build-and-push-webapp, manual-test-webapp]
    runs-on: ubuntu-latest
    if: |
      always() && 
      github.event_name != 'pull_request' && 
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/feature/')) &&
      (needs.manual-test-webapp.result == 'success' || needs.manual-test-webapp.result == 'skipped') &&
      needs.build-and-push-webapp.result == 'success'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'
      
      - name: Configure kubeconfig for K3s
        run: |
          mkdir -p $HOME/.kube
          echo "${{ secrets.KUBECONFIG_K3S_DEV }}" | base64 -d > $HOME/.kube/config
          chmod 600 $HOME/.kube/config
          
          echo "DEBUG: Kubeconfig file exists:"
          ls -la $HOME/.kube/config
          echo "DEBUG: Kubeconfig first lines (redacted):"
          head -n 5 $HOME/.kube/config | sed 's/certificate-authority-data:.*/certificate-authority-data: [REDACTED]/' | sed 's/client-certificate-data:.*/client-certificate-data: [REDACTED]/' | sed 's/client-key-data:.*/client-key-data: [REDACTED]/'
          
          echo "Setting KUBECONFIG environment variable..."
          echo "KUBECONFIG=$HOME/.kube/config" >> $GITHUB_ENV
          export KUBECONFIG=$HOME/.kube/config
          
          echo "Verifying K3s cluster connectivity..."
          kubectl cluster-info
          kubectl version --short
      
      - name: Create namespace if not exists
        run: |
          kubectl create namespace catalog-mcp-dev --dry-run=client -o yaml | kubectl apply -f -
          echo "Namespace catalog-mcp-dev ready"
      
      - name: Create or update application secrets
        run: |
          kubectl create secret generic catalog-mcp-secrets \
            --namespace=catalog-mcp-dev \
            --from-literal=MIDOCEAN_TEST_API_KEY="${{ secrets.MIDOCEAN_TEST_API_KEY }}" \
            --from-literal=MIDOCEAN_PROD_API_KEY="${{ secrets.MIDOCEAN_PROD_API_KEY }}" \
            --from-literal=XD_CONNECTS_PRODUCT_DATA_URL="${{ secrets.XD_CONNECTS_PRODUCT_DATA_URL }}" \
            --dry-run=client -o yaml | kubectl apply -f -
          echo "Secrets updated"
      
      - name: Apply Kubernetes manifests
        run: |
          echo "Applying K8s manifests from k8s/dev/..."
          kubectl apply -f k8s/dev/ --namespace=catalog-mcp-dev
          echo "Manifests applied successfully"
      
      - name: Force rollout restart to pick up new image
        run: |
          echo "Triggering rollout restart..."
          kubectl rollout restart deployment/catalog-mcp-dev -n catalog-mcp-dev
          
          echo "Waiting for rollout to complete (timeout: 5 minutes)..."
          kubectl rollout status deployment/catalog-mcp-dev -n catalog-mcp-dev --timeout=300s
          
          echo "Rollout completed successfully"
      
      - name: Display deployment status
        run: |
          echo ""
          echo "=========================================="
          echo "DEPLOYMENT STATUS"
          echo "=========================================="
          kubectl get deployment catalog-mcp-dev -n catalog-mcp-dev
          echo ""
          
          echo "Pods:"
          kubectl get pods -n catalog-mcp-dev -l app=catalog-mcp-dev
          echo ""
          
          echo "Service:"
          kubectl get service catalog-mcp-dev-service -n catalog-mcp-dev
          echo ""
          
          echo "Ingress:"
          kubectl get ingress catalog-mcp-dev-ingress -n catalog-mcp-dev
          echo ""
          
          echo "=========================================="
          echo "ACCESS INFORMATION"
          echo "=========================================="
          echo "Public URL (ngrok): https://unjestingly-unfoaled-donita.ngrok-free.dev"
          echo "Direct K3s: http://10.108.111.115:3000 (requires port-forward)"
          echo ""
          echo "Testing Commands:"
          echo "  curl https://unjestingly-unfoaled-donita.ngrok-free.dev/health"
          echo ""
          echo "Monitoring:"
          echo "  kubectl logs -f deployment/catalog-mcp-dev -n catalog-mcp-dev"
          echo "  ngrok Dashboard: https://dashboard.ngrok.com"
          echo "=========================================="