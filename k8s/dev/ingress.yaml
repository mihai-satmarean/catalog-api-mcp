apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: catalog-mcp-dev-ingress
  namespace: catalog-mcp-dev
  annotations:
    # Ngrok Operator annotations
    k8s.ngrok.com/description: "MCP Server Development Environment - Auto-deployed from GitHub"
  labels:
    app: catalog-mcp-dev
    environment: development
spec:
  # Use ngrok ingress class (provided by ngrok operator)
  ingressClassName: ngrok
  rules:
  - host: unjestingly-unfoaled-donita.ngrok-free.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: catalog-mcp-dev-service
            port:
              number: 3000
